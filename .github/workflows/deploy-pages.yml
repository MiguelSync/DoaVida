# Publica o app (Flutter web) no GitHub Pages a cada push na branch main.
# Site: https://<usuario>.github.io/<repositorio>/
#
# Pré-requisito (uma vez só): Settings -> Pages -> Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7 # mesma versão usada no desenvolvimento

jobs:
  build:
    name: Compilar web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # --base-href: o site fica em /<repositorio>/, não na raiz do domínio.
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Roda em paralelo e NÃO bloqueia a publicação: serve para acompanhar a
  # qualidade do código (regras de aptidão e compatibilidade sanguínea).
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter test
