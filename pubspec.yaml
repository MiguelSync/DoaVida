name: doa_sangue
description: "DoaVida — App de conexão entre doadores de sangue e hemocentros/hospitais do Alto Vale do Itajaí. Projeto de Extensão UNIDAVI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.2

  # Persistência local + segurança (RNF02)
  shared_preferences: ^2.3.0
  crypto: ^3.0.3

  # Datas em pt-BR (versão definida pelo flutter_localizations)
  intl: any

  # Mapa e geolocalização (RF05) — OpenStreetMap, sem chave de API
  flutter_map: ">=7.0.0 <9.0.0"
  latlong2: ^0.9.1
  geolocator: ">=13.0.0 <15.0.0"

  # Notificações (RF07)
  flutter_local_notifications: ">=18.0.0 <20.0.0"

  # Abrir rota no mapa / ligar
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
